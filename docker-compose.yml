version: '3.8'

services:
  # Phase 2: Production FastAPI Microservice
  fastapi-backend:
    build: .
    container_name: delivery-intelligence-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Phase 1: Interactive Streamlit Research Application
  streamlit-dashboard:
    build: .
    container_name: delivery-intelligence-ui
    command: streamlit run app/delivery_intelligence_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-backend
    restart: unless-stopped
